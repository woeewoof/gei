<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gei ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
}

canvas{
    position:fixed;
    inset:0;
}

#container{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    pointer-events:none;
}

#heart{
    width:260px;
    height:260px;
    animation:heartbeat 1.3s infinite;
}

#heart path{
    fill:none;
    stroke:crimson;
    stroke-width:3;

    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:1200;
    stroke-dashoffset:1200;

    filter:
        drop-shadow(0 0 4px crimson)
        drop-shadow(0 0 8px crimson)
        drop-shadow(0 0 16px crimson);

    animation:
        draw 3s ease forwards,
        glow 2s infinite alternate;
}

#text{
    position:absolute;
    top:68%;
    left:50%;
    transform:translateX(-50%);

    color:crimson;
    font-size:3rem;
    font-weight:bold;

    opacity:0;

    text-shadow:
        0 0 5px crimson,
        0 0 15px crimson,
        0 0 25px crimson;

    animation:
        showText 1s forwards 1.8s,
        textPulse 1.4s infinite 4s;
}

@keyframes draw{
    to{
        stroke-dashoffset:0;
    }
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}

@keyframes glow{
    from{
        filter:
            drop-shadow(0 0 4px crimson)
            drop-shadow(0 0 8px crimson)
            drop-shadow(0 0 16px crimson);
    }

    to{
        filter:
            drop-shadow(0 0 8px crimson)
            drop-shadow(0 0 16px crimson)
            drop-shadow(0 0 32px crimson);
    }
}

@keyframes showText{
    to{
        opacity:1;
    }
}

@keyframes textPulse{
    0%,100%{
        transform:translateX(-50%) scale(1);
    }

    50%{
        transform:translateX(-50%) scale(1.1);
    }
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div id="container">

<svg id="heart" viewBox="0 0 400 400">
    <path d="
    M 200 320
    C 180 290 70 220 70 140
    C 70 70 140 40 200 100
    C 260 40 330 70 330 140
    C 330 220 220 290 200 320
    "/>
</svg>

<div id="text">gei</div>

</div>

<script>

const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const words = [];

class FallingWord{

    constructor(){
        this.reset();
    }

    reset(){
        this.x = Math.random() * canvas.width;
        this.y = -Math.random() * canvas.height;
        this.speed = 1 + Math.random() * 4;
        this.size = 14 + Math.random() * 28;
        this.opacity = 0.15 + Math.random() * 0.85;
    }

    update(){

        this.y += this.speed;

        if(this.y > canvas.height + 50){
            this.y = -50;
            this.x = Math.random() * canvas.width;
        }
    }

    draw(){

        ctx.font = `${this.size}px Arial`;

        ctx.fillStyle =
        `rgba(220,20,60,${this.opacity})`;

        ctx.shadowBlur = 10;
        ctx.shadowColor = "crimson";

        ctx.fillText(
            "gei",
            this.x,
            this.y
        );
    }
}

for(let i = 0; i < 120; i++){
    words.push(new FallingWord());
}

function animate(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    words.forEach(word=>{
        word.update();
        word.draw();
    });

    requestAnimationFrame(
        animate
    );
}

animate();

</script>

</body>
</html>
