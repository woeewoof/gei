<!DOCTYPE html>
<html>
<body>
<canvas id="c" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

ctx.translate(400, 300);
ctx.strokeStyle = "crimson";

function xt(t) {
    return 16 * Math.pow(Math.sin(t), 3);
}

function yt(t) {
    return 13*Math.cos(t)
         - 5*Math.cos(2*t)
         - 2*Math.cos(3*t)
         - Math.cos(4*t);
}

ctx.beginPath();

for (let i = 0; i < 2550; i++) {
    const x = xt(i) * 7.5;
    const y = -yt(i) * 7.5;
    
    if (i === 0) {
        ctx.moveTo(x, y);
    } else {
        ctx.lineTo(x, y);
    }
}

ctx.stroke();
</script>
</body>
</html>
